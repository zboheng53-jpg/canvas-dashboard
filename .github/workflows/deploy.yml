name: Deploy production

# Pull requests run the full suite. A merge into main runs the same suite and,
# only when it passes, deploys that exact commit through the production
# environment. The server never runs `git pull`: activation still uses the
# immutable release layout, atomic switch, health checks and automatic rollback.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Full regression
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install test environment
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m playwright install chromium
          exit $LASTEXITCODE
      - name: Full regression
        shell: powershell
        run: .\scripts\test.ps1
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  deploy:
    name: Deploy
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://canvas-dashboard.xyz
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the checkout is the tested commit
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify main still points to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "This commit has been superseded on main. Use the run for $main_sha." >&2
            exit 1
          fi
      - name: Package release
        run: |
          release="release-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::12}"
          archive="$RUNNER_TEMP/$release.tar.gz"
          git archive --format=tar.gz --output "$archive" "$GITHUB_SHA"
          sha=$(sha256sum "$archive" | cut -d' ' -f1)
          echo "RELEASE_NAME=$release" >> "$GITHUB_ENV"
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "RELEASE_SHA256=$sha" >> "$GITHUB_ENV"
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "Set the DEPLOY_HOST repository variable (for example 124.222.188.101)." >&2
            exit 1
          fi
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "Set the DEPLOY_SSH_KEY production environment secret." >&2
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          install -m 600 deploy/known_hosts "$HOME/.ssh/known_hosts"
      - name: Upload release
        run: |
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=20
            -o ServerAliveCountMax=6
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          for attempt in 1 2 3; do
            if scp "${ssh_opts[@]}" "$RELEASE_ARCHIVE" "deploy@$DEPLOY_HOST:incoming/"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Release upload failed after three attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Activate release
        run: |
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=20
            -o ServerAliveCountMax=6
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          # Activation is attempted once. The installer restores the previous
          # release itself on failure; a lost SSH response must be inspected,
          # not retried blindly.
          ssh "${ssh_opts[@]}" "deploy@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/canvas-deploy release '$RELEASE_NAME' '$RELEASE_SHA256'"
      - name: Verify public health
        run: |
          curl -fsS --retry 10 --retry-delay 3 --retry-connrefused \
            --max-time 10 https://canvas-dashboard.xyz/healthz
      - name: Report release state
        if: always()
        continue-on-error: true
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "deploy@$DEPLOY_HOST" "sudo -n /usr/local/sbin/canvas-deploy status"
