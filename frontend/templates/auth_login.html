<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · Canvas Dashboard</title>
  {% include "_favicon.html" %}
  {% include "_font_assets.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
  <script>window.CSRF_TOKEN = "{{ csrf_token() }}";</script>
  <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body>
  <div class="dashboard auth-page">
    <div class="card auth-card">
      <div class="card-head section-header" style="padding: 0 0 12px; border-bottom: 1px solid var(--ds-line-soft, #eef0f3);">
        <div class="header-left-group"><h2 style="font-size: 20px; font-weight: 600;">登录</h2></div>
      </div>

      <form class="auth-form" id="login-form">
        <div class="field-group">
          <label class="field-label" for="login-username">用户名</label>
          <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username" class="ui-control input">
        </div>
        <div class="field-group">
          <label class="field-label" for="login-password">密码</label>
          <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password" class="ui-control input">
        </div>
        <button type="submit" class="ui-button ui-button--primary ui-button--block btn-quiet" style="height:40px; font-size:14px; width:100%; margin-top:6px;">登录</button>
      </form>

      <p class="ui-help setup-hint" style="margin-top:16px; text-align:center; font-size:13px;">还没有账号？<a href="/register" style="color:var(--ds-accent-ink, #1d4fd7); font-weight:600;">立即注册</a></p>

      <div class="ui-alert ui-alert--danger ui-alert--compact error-banner hidden" id="login-error" role="alert" style="margin-top:12px;"></div>
    </div>
    {% if icp_number %}
    <footer class="site-footer" style="margin-top: 20px;">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">{{ icp_number }}</a>
    </footer>
    {% endif %}
  </div>

  <script>
    async function doLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if (!username || !password) return;

      const btn = document.querySelector('#login-form button');
      btn.textContent = '...';
      btn.disabled = true;

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const result = await resp.json();
        if (result.ok) {
          window.location.href = '/';
        } else {
          document.getElementById('login-error').textContent = result.error || '登录失败';
          document.getElementById('login-error').classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('login-error').textContent = '网络错误';
        document.getElementById('login-error').classList.remove('hidden');
      } finally {
        btn.textContent = '登录';
        btn.disabled = false;
      }
    }

    document.getElementById('login-form').addEventListener('submit', doLogin);
  </script>
</body>
</html>
