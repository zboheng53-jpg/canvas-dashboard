<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · Canvas Dashboard</title>
  {% include "_favicon.html" %}
  {% include "_font_assets.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>window.CSRF_TOKEN = "{{ csrf_token() }}";</script>
  <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body>
  <div class="dashboard auth-page auth-landing-page">
    <div class="auth-landing-layout">
      {% include "_auth_landing_showcase.html" %}

      <section class="auth-landing-right" aria-label="账号登录">
        <div class="auth-landing-right-top">
          <div class="auth-theme-toggle" role="group" aria-label="外观模式">
            <button type="button" class="ui-button ui-button--choice auth-theme-btn" data-appearance-theme="blue" title="蓝白外观" aria-label="切换为蓝白外观">蓝白</button>
            <button type="button" class="ui-button ui-button--choice auth-theme-btn" data-appearance-theme="moss" title="苔绿外观" aria-label="切换为苔绿外观">苔绿</button>
          </div>
          <span class="auth-card-meta-sep" aria-hidden="true">·</span>
          <a href="/privacy">数据与隐私中心</a>
          <span class="auth-card-meta-sep" aria-hidden="true">·</span>
          <a href="https://github.com/zboheng53-jpg/canvas-dashboard" target="_blank" rel="noopener noreferrer" class="auth-card-github-link" title="GitHub 仓库" aria-label="访问 GitHub 仓库">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z"></path></svg>
            <span>GitHub</span>
          </a>
        </div>

        <div class="card auth-card">
          <div class="card-head section-header auth-card-head">
            <div class="header-left-group">
              <h2 class="auth-card-title">账号登录</h2>
            </div>
            <span class="auth-card-badge">个人空间</span>
          </div>

          <form class="auth-form" id="login-form">
            <div class="field-group">
              <label class="field-label" for="login-username">用户名</label>
              <input type="text" id="login-username" placeholder="请输入用户名" autocomplete="username" class="ui-control input">
            </div>
            <div class="field-group">
              <label class="field-label" for="login-password">密码</label>
              <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password" class="ui-control input">
            </div>
            <button type="submit" class="ui-button ui-button--primary ui-button--block auth-submit-btn">登录</button>
          </form>

          <p class="ui-help setup-hint auth-switch-hint">还没有账号？<a href="/register" class="auth-switch-link">立即注册</a></p>
          <p class="ui-help auth-switch-hint"><a href="/reset-password" class="auth-switch-link">忘记密码？</a> 联系维护者获取重置凭据</p>
          <div class="ui-alert ui-alert--danger ui-alert--compact error-banner hidden auth-error-banner" id="login-error" role="alert"></div>
        </div>

        <div class="auth-landing-right-foot">
          {% if icp_number %}
          <footer class="site-footer auth-site-footer">
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">{{ icp_number }}</a>
          </footer>
          {% endif %}
        </div>
      </section>
    </div>
  </div>

  <script>
    async function doLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if (!username || !password) return;

      const btn = document.querySelector('#login-form button');
      btn.textContent = '...';
      btn.disabled = true;

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const result = await resp.json();
        if (result.ok) {
          window.location.href = '/';
        } else {
          document.getElementById('login-error').textContent = result.error || '登录失败';
          document.getElementById('login-error').classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('login-error').textContent = '网络错误';
        document.getElementById('login-error').classList.remove('hidden');
      } finally {
        btn.textContent = '登录';
        btn.disabled = false;
      }
    }

    document.getElementById('login-form').addEventListener('submit', doLogin);
  </script>
</body>
</html>
