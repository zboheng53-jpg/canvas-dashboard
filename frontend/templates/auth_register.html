<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · Canvas Dashboard</title>
  {% include "_favicon.html" %}
  {% include "_font_assets.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
  <script>window.CSRF_TOKEN = "{{ csrf_token() }}";</script>
  <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body>
  <div class="dashboard auth-page auth-landing-page">
    <div class="auth-landing-layout">
      {% include "_auth_landing_showcase.html" %}

      <section class="auth-landing-right" aria-label="账号注册">
        <div class="auth-landing-right-top">
          <a href="/privacy">数据与隐私中心</a>
          <span class="auth-card-meta-sep" aria-hidden="true">·</span>
          <a href="https://github.com/zboheng53-jpg/canvas-dashboard" target="_blank" rel="noopener noreferrer" class="auth-card-github-link" title="GitHub 仓库" aria-label="访问 GitHub 仓库">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z"></path></svg>
            <span>GitHub</span>
          </a>
        </div>

        <div class="card auth-card">
          <div class="card-head section-header" style="padding: 0 0 12px; border-bottom: 1px solid var(--ds-line-soft, #eef0f3);">
            <div class="header-left-group"><h2 style="font-size: 20px; font-weight: 600;">注册账号</h2></div>
          </div>

          <form class="auth-form" id="register-form">
            <div class="field-group">
              <label class="field-label" for="register-username">用户名</label>
              <input type="text" id="register-username" placeholder="3-20位字母/数字/下划线" autocomplete="username" class="ui-control input">
            </div>
            <div class="field-group">
              <label class="field-label" for="register-password">密码</label>
              <input type="password" id="register-password" placeholder="至少6位" autocomplete="new-password" class="ui-control input">
            </div>
            <button type="submit" class="ui-button ui-button--primary ui-button--block btn-quiet" style="height:40px; font-size:14px; width:100%; margin-top:6px;">注册</button>
          </form>

          <p class="ui-help setup-hint" style="margin-top:16px; text-align:center; font-size:13px;">已有账号？<a href="/login" style="color:var(--ds-accent-ink, #1d4fd7); font-weight:600;">直接登录</a></p>
          <p class="ui-help auth-card-privacy-note">
            <a href="/privacy">数据与隐私中心</a>
            <span class="auth-card-meta-sep" aria-hidden="true">·</span>
            <a href="https://github.com/zboheng53-jpg/canvas-dashboard" target="_blank" rel="noopener noreferrer" class="auth-card-github-link">GitHub</a>
          </p>

          <div class="ui-alert ui-alert--danger ui-alert--compact error-banner hidden" id="register-error" role="alert" style="margin-top:12px;"></div>
        </div>

        <div class="auth-landing-right-foot">
          {% if icp_number %}
          <footer class="site-footer" style="margin: 0;">
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">{{ icp_number }}</a>
          </footer>
          {% endif %}
        </div>
      </section>
    </div>
  </div>

  <script>
    async function doRegister(e) {
      e.preventDefault();
      const username = document.getElementById('register-username').value.trim();
      const password = document.getElementById('register-password').value;
      if (!username || !password) return;

      const btn = document.querySelector('#register-form button');
      btn.textContent = '...';
      btn.disabled = true;

      try {
        const resp = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const result = await resp.json();
        if (result.ok) {
          window.location.href = '/';
        } else {
          document.getElementById('register-error').textContent = result.error || '注册失败';
          document.getElementById('register-error').classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('register-error').textContent = '网络错误';
        document.getElementById('register-error').classList.remove('hidden');
      } finally {
        btn.textContent = '注册';
        btn.disabled = false;
      }
    }

    document.getElementById('register-form').addEventListener('submit', doRegister);
  </script>
</body>
</html>
