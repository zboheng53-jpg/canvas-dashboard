<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重置密码 · Canvas Dashboard</title>
  {% include "_favicon.html" %}
  {% include "_font_assets.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>window.CSRF_TOKEN = "{{ csrf_token() }}";</script>
  <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body>
  <div class="dashboard auth-page auth-landing-page">
    <div class="auth-landing-layout">
      {% include "_auth_landing_showcase.html" %}

      <section class="auth-landing-right" aria-label="账号找回">
        <div class="auth-landing-right-top">
          <div class="auth-theme-toggle" role="group" aria-label="主题配色">
            <button type="button" class="ui-button ui-button--choice auth-theme-btn" data-appearance-theme="blue" title="蓝白外观" aria-label="切换为蓝白外观">蓝白</button>
            <button type="button" class="ui-button ui-button--choice auth-theme-btn" data-appearance-theme="moss" title="苔绿外观" aria-label="切换为苔绿外观">苔绿</button>
          </div>
          <button type="button" class="ui-button ui-button--choice auth-color-mode-btn" data-color-mode-toggle title="切换浅色或深色外观" aria-label="切换为深色外观" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
            <span data-color-mode-toggle-label>深色</span>
          </button>
          <span class="auth-card-meta-sep" aria-hidden="true">·</span>
          <a href="/privacy">数据与隐私中心</a>
          <span class="auth-card-meta-sep" aria-hidden="true">·</span>
          <a href="https://github.com/zboheng53-jpg/canvas-dashboard" target="_blank" rel="noopener noreferrer" class="auth-card-github-link" title="GitHub 仓库" aria-label="访问 GitHub 仓库">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z"></path></svg>
            <span>GitHub</span>
          </a>
        </div>

        <div class="card auth-card">
          <div class="card-head section-header auth-card-head">
            <div class="header-left-group">
              <h2 class="auth-card-title">账号找回</h2>
            </div>
            <span class="auth-card-badge">重置凭据</span>
          </div>

          <p class="auth-reset-desc">请填写维护者线下提供的一次性重置凭据。凭据过期或使用后将立即失效。</p>

          <form class="auth-form" id="reset-form" novalidate>
            <div class="field-group">
              <label class="field-label" for="reset-username">用户名</label>
              <input type="text" id="reset-username" name="username" placeholder="请输入用户名" autocomplete="username" autofocus class="ui-control input">
            </div>
            <div class="field-group">
              <label class="field-label" for="reset-token">重置凭据</label>
              <input type="text" id="reset-token" name="token" placeholder="粘贴维护者提供的重置凭据" autocomplete="one-time-code" class="ui-control input">
            </div>
            <div class="field-group">
              <label class="field-label" for="reset-password">新密码</label>
              <div class="ui-input-shell">
                <input type="password" id="reset-password" name="password" minlength="6" placeholder="至少6位" autocomplete="new-password" class="ui-control input">
                <span role="button" tabindex="0" class="auth-pw-toggle" data-pw-toggle="reset-password" aria-label="显示密码" aria-pressed="false" title="显示或隐藏密码">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.75"></circle></svg>
                </span>
              </div>
            </div>
            <button type="submit" class="ui-button ui-button--primary ui-button--block auth-submit-btn">重置密码</button>
          </form>

          <p class="ui-help setup-hint auth-switch-hint">想起密码了？<a href="/login" class="auth-switch-link">返回登录</a></p>
          <div class="ui-alert ui-alert--danger ui-alert--compact error-banner hidden auth-error-banner" id="reset-error" role="alert"></div>
        </div>

        <div class="auth-landing-right-foot">
          {% if icp_number %}
          <footer class="site-footer auth-site-footer">
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">{{ icp_number }}</a>
          </footer>
          {% endif %}
        </div>
      </section>
    </div>
  </div>

  <script>
    (function initResetPage() {
      const form = document.getElementById('reset-form');
      const usernameInput = document.getElementById('reset-username');
      const tokenInput = document.getElementById('reset-token');
      const passwordInput = document.getElementById('reset-password');
      const errorEl = document.getElementById('reset-error');
      const submitBtn = document.querySelector('#reset-form button[type="submit"]');

      const showError = (msg) => {
        if (!errorEl) return;
        errorEl.textContent = msg;
        errorEl.classList.remove('hidden');
      };
      const clearError = () => {
        if (!errorEl) return;
        errorEl.textContent = '';
        errorEl.classList.add('hidden');
      };

      [usernameInput, tokenInput, passwordInput].forEach((el) => {
        el.addEventListener('input', clearError);
      });

      document.querySelectorAll('[data-pw-toggle]').forEach((toggle) => {
        const targetInput = document.getElementById(toggle.dataset.pwToggle);
        if (!targetInput) return;
        const flip = () => {
          const reveal = targetInput.type === 'password';
          targetInput.type = reveal ? 'text' : 'password';
          toggle.setAttribute('aria-pressed', String(reveal));
          toggle.setAttribute('aria-label', reveal ? '隐藏密码' : '显示密码');
        };
        toggle.addEventListener('click', flip);
        toggle.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            flip();
          }
        });
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        clearError();
        const username = usernameInput.value.trim();
        const token = tokenInput.value.trim();
        const password = passwordInput.value;

        if (!username) {
          showError('请输入用户名。');
          usernameInput.focus();
          return;
        }
        if (!token) {
          showError('请输入维护者提供的重置凭据。');
          tokenInput.focus();
          return;
        }
        if (!password || password.length < 6) {
          showError('请输入至少 6 位的新密码。');
          passwordInput.focus();
          return;
        }

        submitBtn.textContent = '重置中…';
        submitBtn.disabled = true;

        try {
          const response = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, token, password }),
          });
          const data = await response.json();
          if (response.ok && data.ok) {
            window.location.href = '/login?reset=1';
            return;
          }
          showError(data.error || '重置失败');
        } catch (err) {
          showError('网络错误，请稍后重试');
        } finally {
          submitBtn.textContent = '重置密码';
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
