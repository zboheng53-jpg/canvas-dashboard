<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>重置密码 · Canvas Dashboard</title>
    {% include "_font_assets.html" %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script>window.CSRF_TOKEN = "{{ csrf_token() }}";</script>
    <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
  </head>
  <body>
    <main class="auth-page">
      <form class="auth-card" id="reset-form">
        <p class="auth-kicker">ACCOUNT RECOVERY</p>
        <h1>设置新密码</h1>
        <p>请填写管理员线下提供的一次性重置凭证。凭证过期或使用后将立即失效。</p>
        <label>用户名<input name="username" required autocomplete="username"></label>
        <label>重置凭证<input name="token" required autocomplete="one-time-code"></label>
        <label>新密码<input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
        <p class="error-banner hidden" id="reset-error" role="alert"></p>
        <button type="submit">重置密码</button>
        <a href="/login">返回登录</a>
      </form>
    </main>
    <script>
      document.getElementById('reset-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(Object.fromEntries(form)),
        });
        const data = await response.json();
        if (response.ok && data.ok) { window.location.href = '/login'; return; }
        const error = document.getElementById('reset-error');
        error.textContent = data.error || '重置失败'; error.classList.remove('hidden');
      });
    </script>
  </body>
</html>
