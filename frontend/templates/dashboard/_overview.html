          <section class="dashboard-view" id="dashboard-view-overview" data-view-panel="overview">
    <!-- Top Bar -->
    <div class="card context-card">
    <header class="top-bar opt1-header enter-top-bar">
     <div class="opt1-col left">
        <div class="weather-campus-switch" role="tablist" aria-label="选择天气校区">
         <button type="button" class="ui-button weather-campus-option is-active" data-campus="siping" role="tab" aria-selected="true">四平路校区</button>
          <span class="weather-campus-separator" aria-hidden="true">·</span>
         <button type="button" class="ui-button weather-campus-option" data-campus="jiading" role="tab" aria-selected="false">嘉定校区</button>
        </div>
       <div class="opt1-temp-row">
          <span class="weather-icn-opt1 weather-emoji" id="weather-emoji" role="img" aria-label="天气">
            <svg class="weather-outline-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.28 5.28l1.42 1.42M17.3 17.3l1.42 1.42M18.72 5.28 17.3 6.7M6.7 17.3l-1.42 1.42"></path></svg>
          </span>
          <span class="weather-temp" id="weather-temp">--&deg;</span>
        </div>
       <div class="opt1-weather-detail">
         <span id="weather-desc" class="weather-desc">&#21152;&#36733;&#20013;...</span>
          <span id="weather-detail" class="weather-detail"></span>
        </div>
      </div>
      <div class="opt1-col center">
        <div class="opt1-time" id="time">--:--:--</div>
        <div class="opt1-date">
          <span id="date">----&#24180;--&#26376;--&#26085;</span>
          <span id="weekday">&#26143;&#26399;-</span>
        </div>
      </div>
      <div class="opt1-col right">
        <div class="opt1-week-pill" id="term-week-badge">--</div>
        <div class="opt1-term" id="term-info">&#21152;&#36733;&#20013;...</div>
      </div>
    </header>
    </div>

    <!-- KPI 概览 -->
    <div class="kpis enter-kpis" id="dashboard-kpis">
      <div class="kpi">
        <div class="k-label">待完成</div>
        <div class="k-value" id="stat-pending-count">0</div>
        <div class="k-hint" id="stat-pending-diff">未有新变化</div>
      </div>
      <div class="kpi">
        <div class="k-label">72 小时内截止</div>
        <div class="k-value" id="stat-due-count">0</div>
        <div class="k-hint warn" id="stat-due-overdue">含 0 项已逾期</div>
      </div>
      <div class="kpi">
        <div class="k-label">今日课程</div>
        <div class="k-value" id="stat-course-count">0</div>
        <div class="k-hint" id="stat-course-next">无更多课程</div>
      </div>
    </div>

    <!-- 移动端平台同步关注横幅 (Mobile Platform Attention Banner) -->
    <div class="mobile-attention-banner hidden" id="mobile-attention-banner" onclick="switchDashboardView('connections')" role="button" tabindex="0">
      <div class="mobile-attention-banner-left">
        <span class="mobile-attention-badge">!</span>
        <span id="mobile-attention-text">需要处理平台同步配置</span>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <!-- Main Content -->
    <main>
      <section class="column main-column">
        <!-- Compact Deadline List for Today/Overdue Pending Ordinary Assignments -->
        <section class="card today-deadlines-card enter-main-card" id="today-deadlines-card" aria-labelledby="today-deadlines-title">
          <div class="card-head section-header">
            <div class="header-left-group">
              <h2 id="today-deadlines-title" style="font-size: 20px;">今日截止与逾期</h2>
            </div>
            <div class="right header-right">
              <span class="muted" id="today-deadlines-count" style="font-size: 13px;">0 项</span>
            </div>
          </div>
          <div class="today-deadlines-list" id="today-deadlines-list" aria-live="polite">
            <div class="ui-loading ui-loading--block empty-state" role="status">加载截止事项…</div>
          </div>
        </section>

        <!-- Main Timeline: Today's Courses and Actual Timed Blocks -->
        <section class="card today-timeline-card enter-main-card" id="today-schedule-card" aria-labelledby="today-schedule-title">
          <div class="card-head section-header">
            <div class="header-left-group">
              <h2 id="today-schedule-title" style="font-size: 20px;">今日日程时间线</h2>
            </div>
            <span class="muted" id="today-schedule-sub" style="font-size: 13px;">今日日程</span>
            <div class="right header-right" style="display: flex; align-items: center; gap: 4px;">
              <button type="button" class="ui-icon-button icon-btn" id="btn-search-actions" title="查找事项" aria-label="查找事项" onclick="openActionSearch()"><svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
              <button type="button" class="ui-icon-button icon-btn" title="添加日程" aria-label="添加日程" onclick="switchDashboardView('schedule').then(() => openScheduleItemModal('one-off'))"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-7-7h14"></path></svg></button>
            </div>
          </div>
          <div class="timeline rail-schedule-content" id="today-schedule-content" aria-live="polite" aria-busy="true">
            <div class="ui-loading ui-loading--block rail-empty-state is-loading" role="status">
              <div>
                <strong>正在加载今日日程…</strong>
                <p>请稍候</p>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>
          </section>
