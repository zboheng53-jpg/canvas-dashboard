<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智学盟接入 · Canvas Dashboard</title>
  {% include "_favicon.html" %}
  {% include "_font_assets.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>window.CSRF_TOKEN = "{{ csrf_token() }}";</script>
  <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body>
  <div class="dashboard">
    <a href="/" class="login-page-back">&#x2190; 返回看板</a>
    <div class="card enter-main-card">
      <div class="section-header">
        <h2>智学盟</h2>
      </div>

      <p class="ui-feedback ui-feedback--info setup-hint" id="status-line" role="status" aria-live="polite">检查中...</p>

      <div class="ui-card ui-card--subtle ui-help detail-content-box connection-data-note connection-trust-card">
        <div class="connection-trust-card__head">
          <strong>智学盟连接说明</strong>
          <a href="/privacy" target="_blank" rel="noopener noreferrer" class="connection-trust-card__link">查看隐私说明 →</a>
        </div>
        <dl class="connection-trust-grid">
          <div class="connection-trust-row"><dt>保存内容</dt><dd>加密访问令牌（X-Access-Token）与已选课程</dd></div>
          <div class="connection-trust-row"><dt>用途</dt><dd>仅用于同步所选课程的未交作业</dd></div>
          <div class="connection-trust-row"><dt>不会保存</dt><dd>手机号、短信验证码与登录密码（仅当次换取令牌）</dd></div>
          <div class="connection-trust-row"><dt>断开连接后</dt><dd>访问令牌立即删除，历史作业缓存保留</dd></div>
        </dl>
      </div>

      <div class="login-body" id="form-body">
        <div id="zhixuemeng-logged-in" class="hidden logged-in-row">
          <span class="logged-in-label">已连接</span>
          <label class="ui-label connection-field-label" for="zxm-course-select">选择课程</label>
          <select id="zxm-course-select" class="ui-control logged-in-select"></select>
          <button type="button" onclick="logoutZhixuemeng()" class="ui-button ui-button--danger ui-button--sm">断开连接</button>
        </div>

        <div id="zhixuemeng-setup" class="hidden">
          <div class="ktp-auth-tabs" role="tablist" aria-label="智学盟登录方式切换">
            <button type="button" class="ui-button ui-button--choice ktp-auth-tab is-active" id="zxm-tab-btn-sms" role="tab" aria-selected="true" onclick="switchZxmPageTab('sms')">短信验证码登录</button>
            <button type="button" class="ui-button ui-button--choice ktp-auth-tab" id="zxm-tab-btn-pwd" role="tab" aria-selected="false" onclick="switchZxmPageTab('pwd')">账号密码登录</button>
          </div>
          <div id="zxm-sms-login-panel">
            <p class="ui-help setup-hint">请输入智学盟平台的手机号和验证码登录：</p>
            <label class="ui-label connection-field-label" for="zxm-phone">智学盟手机号</label>
            <div class="add-todo-form mb-s">
              <input type="tel" id="zxm-phone" placeholder="手机号" autocomplete="tel" class="ui-control">
              <button type="button" id="zxm-send-sms-btn" onclick="sendZhixuemengSms()" class="ui-button ui-button--secondary ui-button--block btn-wide">发送验证码</button>
            </div>
            <label class="ui-label connection-field-label" for="zxm-captcha">短信验证码</label>
            <div class="add-todo-form mb-s">
              <input type="text" id="zxm-captcha" placeholder="验证码" autocomplete="one-time-code" class="ui-control">
              <button type="button" id="zxm-sms-login-btn" onclick="doZhixuemengLogin()" class="ui-button ui-button--primary ui-button--block btn-wide btn-accent">登录</button>
            </div>
          </div>
          <div id="zxm-password-login" class="hidden mt-s">
            <form class="add-todo-form" id="zxm-pwd-form">
              <label class="ui-label connection-field-label" for="zxm-username">智学盟用户名</label>
              <input type="text" id="zxm-username" placeholder="用户名" autocomplete="username" class="ui-control">
              <label class="ui-label connection-field-label" for="zxm-password">智学盟密码</label>
              <input type="password" id="zxm-password" placeholder="密码" autocomplete="current-password" class="ui-control">
              <button type="submit" id="zxm-pwd-login-btn" class="ui-button ui-button--primary ui-button--block btn-wide">登录</button>
            </form>
          </div>
        </div>

        <div class="ui-alert ui-alert--danger ui-alert--compact error-banner hidden" id="zhixuemeng-error" role="alert"></div>
      </div>
    </div>
  </div>

  <script>
    function populateZhixuemengCourseSelect(select, courses, selectedCourse) {
      select.replaceChildren(new Option('全部课程', ''));
      (Array.isArray(courses) ? courses : []).forEach((course) => {
        const option = document.createElement('option');
        option.value = String(course.courseCode || '');
        option.textContent = `${course.courseCode || ''} - ${course.courseName || ''}`;
        select.append(option);
      });
      select.value = selectedCourse || '';
    }

    function setZhixuemengPageStatus(text, semantic = 'neutral') {
      const statusLine = document.getElementById('status-line');
      statusLine.textContent = text;
      statusLine.className = `ui-feedback ui-feedback--${semantic} setup-hint`;
    }

    function showZhixuemengError(message) {
      const error = document.getElementById('zhixuemeng-error');
      error.textContent = message || '';
      error.classList.toggle('hidden', !message);
    }

    function switchZxmPageTab(tab) {
      const smsPanel = document.getElementById('zxm-sms-login-panel');
      const pwdPanel = document.getElementById('zxm-password-login');
      const smsTab = document.getElementById('zxm-tab-btn-sms');
      const pwdTab = document.getElementById('zxm-tab-btn-pwd');
      showZhixuemengError('');
      const isPwd = tab === 'pwd';
      smsPanel?.classList.toggle('hidden', isPwd);
      pwdPanel?.classList.toggle('hidden', !isPwd);
      smsTab?.classList.toggle('is-active', !isPwd);
      smsTab?.setAttribute('aria-selected', String(!isPwd));
      pwdTab?.classList.toggle('is-active', isPwd);
      pwdTab?.setAttribute('aria-selected', String(isPwd));
    }

    async function checkZhixuemengConfig() {
      try {
        const resp = await fetch('/api/zhixuemeng/config');
        const result = await resp.json();
        if (result.ok && result.has_token) {
          setZhixuemengPageStatus('当前状态：已连接', 'success');
          document.getElementById('zhixuemeng-setup').classList.add('hidden');
          document.getElementById('zhixuemeng-logged-in').classList.remove('hidden');
          if (result.courses) {
            const select = document.getElementById('zxm-course-select');
            populateZhixuemengCourseSelect(select, result.courses, result.selected_course);
          }
        } else {
          setZhixuemengPageStatus('当前状态：未连接', 'neutral');
          document.getElementById('zhixuemeng-setup').classList.remove('hidden');
          document.getElementById('zhixuemeng-logged-in').classList.add('hidden');
        }
      } catch (e) {
        setZhixuemengPageStatus('状态获取失败', 'danger');
        document.getElementById('zhixuemeng-setup').classList.remove('hidden');
      }
    }

    let zxmSmsCountdown = 0;
    let zxmSmsTimer = null;

    async function sendZhixuemengSms() {
      if (zxmSmsCountdown > 0) return;
      const phoneInput = document.getElementById('zxm-phone');
      const phone = phoneInput.value.trim();
      if (!phone) { showZhixuemengError('请输入手机号'); phoneInput.focus(); return; }
      showZhixuemengError('');

      const btn = document.getElementById('zxm-send-sms-btn');
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      btn.textContent = '发送中…';

      try {
        const resp = await fetch('/api/zhixuemeng/send-sms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone }),
        });
        const result = await resp.json();
        if (result.ok) {
          zxmSmsCountdown = 60;
          if (zxmSmsTimer) clearInterval(zxmSmsTimer);
          btn.setAttribute('aria-busy', 'false');
          zxmSmsTimer = setInterval(() => {
            zxmSmsCountdown--;
            if (zxmSmsCountdown <= 0) {
              clearInterval(zxmSmsTimer);
              zxmSmsTimer = null;
              btn.textContent = '发送验证码';
              btn.disabled = false;
            } else {
              btn.textContent = `${zxmSmsCountdown}s 后重发`;
            }
          }, 1000);
          btn.textContent = `${zxmSmsCountdown}s 后重发`;
          document.getElementById('zxm-captcha')?.focus();
        } else {
          showZhixuemengError(result.error || '发送失败');
          btn.textContent = '发送验证码';
          btn.disabled = false;
          btn.setAttribute('aria-busy', 'false');
        }
      } catch (e) {
        showZhixuemengError('网络错误，请稍后重试');
        btn.textContent = '发送验证码';
        btn.disabled = false;
        btn.setAttribute('aria-busy', 'false');
      }
    }

    async function doZhixuemengLogin() {
      const phoneInput = document.getElementById('zxm-phone');
      const captchaInput = document.getElementById('zxm-captcha');
      const phone = phoneInput.value.trim();
      const captcha = captchaInput.value.trim();
      if (!phone || !captcha) {
        showZhixuemengError('请输入手机号和验证码');
        (!phone ? phoneInput : captchaInput).focus();
        return;
      }
      showZhixuemengError('');

      const btn = document.getElementById('zxm-sms-login-btn');
      const origText = btn.textContent;
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      btn.textContent = '登录中…';

      try {
        const resp = await fetch('/api/zhixuemeng/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, captcha }),
        });
        const result = await resp.json();
        if (result.ok) {
          captchaInput.value = '';
          if (zxmSmsTimer) { clearInterval(zxmSmsTimer); zxmSmsTimer = null; zxmSmsCountdown = 0; }
          const smsBtn = document.getElementById('zxm-send-sms-btn');
          smsBtn.textContent = '发送验证码';
          smsBtn.disabled = false;
          checkZhixuemengConfig();
        } else {
          showZhixuemengError(result.error || '登录失败');
        }
      } catch (e) {
        showZhixuemengError('网络错误，请稍后重试');
      } finally {
        btn.textContent = origText;
        btn.disabled = false;
        btn.setAttribute('aria-busy', 'false');
      }
    }

    function showZxmPasswordLogin() {
      switchZxmPageTab('pwd');
    }

    async function doZhixuemengPasswordLogin(e) {
      e.preventDefault();
      const userInput = document.getElementById('zxm-username');
      const passInput = document.getElementById('zxm-password');
      const username = userInput.value.trim();
      const password = passInput.value.trim();
      if (!username || !password) {
        showZhixuemengError('请输入用户名和密码');
        (!username ? userInput : passInput).focus();
        return;
      }
      showZhixuemengError('');

      const btn = document.getElementById('zxm-pwd-login-btn');
      const origText = btn.textContent;
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      btn.textContent = '登录中…';

      try {
        const resp = await fetch('/api/zhixuemeng/login-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const result = await resp.json();
        if (result.ok) {
          checkZhixuemengConfig();
        } else {
          showZhixuemengError(result.error || '登录失败');
        }
      } catch (e) {
        showZhixuemengError('网络错误，请稍后重试');
      } finally {
        btn.textContent = origText;
        btn.disabled = false;
        btn.setAttribute('aria-busy', 'false');
      }
    }

    async function changeZhixuemengCourse() {
      const select = document.getElementById('zxm-course-select');
      const courseCode = select.value;
      try {
        const resp = await fetch('/api/zhixuemeng/course', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ course_code: courseCode }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || !data.ok) {
          showZhixuemengError(data.error || '保存课程筛选失败');
        } else {
          showZhixuemengError('');
          setZhixuemengPageStatus('当前状态：已连接（课程筛选已保存）', 'success');
        }
      } catch (e) {
        showZhixuemengError('保存课程筛选失败，请稍后重试');
      }
    }

    async function logoutZhixuemeng() {
      try {
        await fetch('/api/zhixuemeng/logout', { method: 'POST' });
      } catch (e) { /* ignore */ }
      setZhixuemengPageStatus('当前状态：未连接', 'neutral');
      document.getElementById('zhixuemeng-setup').classList.remove('hidden');
      document.getElementById('zhixuemeng-logged-in').classList.add('hidden');
      showZhixuemengError('');
      switchZxmPageTab('sms');
    }

    document.getElementById('zxm-course-select')?.addEventListener('change', changeZhixuemengCourse);
    document.getElementById('zxm-pwd-form')?.addEventListener('submit', doZhixuemengPasswordLogin);
    ['zxm-phone', 'zxm-captcha', 'zxm-username', 'zxm-password'].forEach((id) => {
      document.getElementById(id)?.addEventListener('input', () => showZhixuemengError(''));
    });

    checkZhixuemengConfig();
  </script>
</body>
</html>
