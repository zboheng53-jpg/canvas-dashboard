<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智学盟接入 · Canvas Dashboard</title>
  {% include "_favicon.html" %}
  {% include "_font_assets.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>window.CSRF_TOKEN = "{{ csrf_token() }}";</script>
  <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body>
  <div class="dashboard">
    <a href="/" class="login-page-back">&#x2190; 返回看板</a>
    <div class="card enter-main-card">
      <div class="section-header">
        <h2>智学盟</h2>
      </div>

      <p class="ui-feedback ui-feedback--info setup-hint" id="status-line" role="status" aria-live="polite">检查中...</p>

      <div class="login-body" id="form-body">
        <div id="zhixuemeng-logged-in" class="hidden logged-in-row">
          <span class="logged-in-label">已登录</span>
          <select id="zxm-course-select" onchange="changeZhixuemengCourse()" class="ui-control logged-in-select"></select>
          <a href="#" onclick="logoutZhixuemeng();return false;" class="logged-in-link">登出</a>
        </div>

        <div id="zhixuemeng-setup" class="hidden">
          <p class="ui-help setup-hint">请输入智学盟平台的手机号和验证码登录：</p>
          <div class="add-todo-form mb-s">
            <input type="tel" id="zxm-phone" placeholder="手机号" autocomplete="off" class="ui-control">
            <button type="button" id="zxm-send-sms-btn" onclick="sendZhixuemengSms()" class="ui-button ui-button--secondary ui-button--block btn-wide">发送验证码</button>
          </div>
          <div class="add-todo-form mb-s">
            <input type="text" id="zxm-captcha" placeholder="验证码" autocomplete="off" class="ui-control">
            <button type="button" onclick="doZhixuemengLogin()" class="ui-button ui-button--primary ui-button--block btn-wide btn-accent">登录</button>
          </div>
          <div class="ui-help form-note">
            <a href="#" onclick="showZxmPasswordLogin();return false;">使用密码登录</a>
          </div>
          <div id="zxm-password-login" class="hidden mt-s">
            <form class="add-todo-form" id="zxm-pwd-form">
              <input type="text" id="zxm-username" placeholder="用户名" autocomplete="off" class="ui-control">
              <input type="password" id="zxm-password" placeholder="密码" autocomplete="off" class="ui-control">
              <button type="submit" class="ui-button ui-button--primary ui-button--block btn-wide">登录</button>
            </form>
          </div>
        </div>

        <div class="ui-alert ui-alert--danger ui-alert--compact error-banner hidden" id="zhixuemeng-error" role="alert"></div>
      </div>
    </div>
  </div>

  <script>
    function populateZhixuemengCourseSelect(select, courses, selectedCourse) {
      select.replaceChildren(new Option('全部课程', ''));
      (Array.isArray(courses) ? courses : []).forEach((course) => {
        const option = document.createElement('option');
        option.value = String(course.courseCode || '');
        option.textContent = `${course.courseCode || ''} - ${course.courseName || ''}`;
        select.append(option);
      });
      select.value = selectedCourse || '';
    }

    function setZhixuemengPageStatus(text, semantic = 'neutral') {
      const statusLine = document.getElementById('status-line');
      statusLine.textContent = text;
      statusLine.className = `ui-feedback ui-feedback--${semantic} setup-hint`;
    }

    function showZhixuemengError(message) {
      const error = document.getElementById('zhixuemeng-error');
      error.textContent = message;
      error.classList.remove('hidden');
    }

    async function checkZhixuemengConfig() {
      try {
        const resp = await fetch('/api/zhixuemeng/config');
        const result = await resp.json();
        if (result.ok && result.has_token) {
          setZhixuemengPageStatus('当前状态：已登录', 'success');
          document.getElementById('zhixuemeng-setup').classList.add('hidden');
          document.getElementById('zhixuemeng-logged-in').classList.remove('hidden');
          if (result.courses) {
            const select = document.getElementById('zxm-course-select');
            populateZhixuemengCourseSelect(select, result.courses, result.selected_course);
          }
        } else {
          setZhixuemengPageStatus('当前状态：未登录', 'neutral');
          document.getElementById('zhixuemeng-setup').classList.remove('hidden');
          document.getElementById('zhixuemeng-logged-in').classList.add('hidden');
        }
      } catch (e) {
        setZhixuemengPageStatus('状态获取失败', 'danger');
        document.getElementById('zhixuemeng-setup').classList.remove('hidden');
      }
    }

    let zxmSmsCountdown = 0;
    let zxmSmsTimer = null;

    async function sendZhixuemengSms() {
      if (zxmSmsCountdown > 0) return;
      const phone = document.getElementById('zxm-phone').value.trim();
      if (!phone) { showZhixuemengError('请输入手机号'); return; }

      const btn = document.getElementById('zxm-send-sms-btn');
      btn.disabled = true;

      try {
        const resp = await fetch('/api/zhixuemeng/send-sms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone }),
        });
        const result = await resp.json();
        if (result.ok) {
          zxmSmsCountdown = 60;
          if (zxmSmsTimer) clearInterval(zxmSmsTimer);
          zxmSmsTimer = setInterval(() => {
            zxmSmsCountdown--;
            if (zxmSmsCountdown <= 0) {
              clearInterval(zxmSmsTimer);
              zxmSmsTimer = null;
              btn.textContent = '发送验证码';
              btn.disabled = false;
            } else {
              btn.textContent = `${zxmSmsCountdown}秒后发送`;
            }
          }, 1000);
          btn.textContent = `${zxmSmsCountdown}秒后发送`;
        } else {
          showZhixuemengError(result.error || '发送失败');
          btn.disabled = false;
        }
      } catch (e) {
        showZhixuemengError('网络错误');
        btn.disabled = false;
      }
    }

    async function doZhixuemengLogin() {
      const phone = document.getElementById('zxm-phone').value.trim();
      const captcha = document.getElementById('zxm-captcha').value.trim();
      if (!phone || !captcha) { showZhixuemengError('请输入手机号和验证码'); return; }

      try {
        const resp = await fetch('/api/zhixuemeng/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, captcha }),
        });
        const result = await resp.json();
        if (result.ok) {
          document.getElementById('zxm-captcha').value = '';
          if (zxmSmsTimer) { clearInterval(zxmSmsTimer); zxmSmsTimer = null; zxmSmsCountdown = 0; }
          document.getElementById('zxm-send-sms-btn').textContent = '发送验证码';
          document.getElementById('zxm-send-sms-btn').disabled = false;
          checkZhixuemengConfig();
        } else {
          showZhixuemengError(result.error || '登录失败');
        }
      } catch (e) {
        showZhixuemengError('网络错误');
      }
    }

    function showZxmPasswordLogin() {
      document.getElementById('zxm-password-login').classList.toggle('hidden');
    }

    async function doZhixuemengPasswordLogin(e) {
      e.preventDefault();
      const username = document.getElementById('zxm-username').value.trim();
      const password = document.getElementById('zxm-password').value.trim();
      if (!username || !password) return;

      try {
        const resp = await fetch('/api/zhixuemeng/login-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const result = await resp.json();
        if (result.ok) {
          checkZhixuemengConfig();
        } else {
          showZhixuemengError(result.error || '登录失败');
        }
      } catch (e) {
        showZhixuemengError('网络错误');
      }
    }

    async function changeZhixuemengCourse() {
      const select = document.getElementById('zxm-course-select');
      const courseCode = select.value;
      try {
        await fetch('/api/zhixuemeng/course', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ course_code: courseCode }),
        });
      } catch (e) { /* ignore */ }
    }

    async function logoutZhixuemeng() {
      try {
        await fetch('/api/zhixuemeng/logout', { method: 'POST' });
      } catch (e) { /* ignore */ }
      setZhixuemengPageStatus('当前状态：未登录', 'neutral');
      document.getElementById('zhixuemeng-setup').classList.remove('hidden');
      document.getElementById('zhixuemeng-logged-in').classList.add('hidden');
      document.getElementById('zhixuemeng-error').classList.add('hidden');
      document.getElementById('zxm-password-login').classList.add('hidden');
    }

    const zxmPwdFormEl = document.getElementById('zxm-pwd-form');
    if (zxmPwdFormEl) zxmPwdFormEl.addEventListener('submit', doZhixuemengPasswordLogin);

    checkZhixuemengConfig();
  </script>
</body>
</html>
