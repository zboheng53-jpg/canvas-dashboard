<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同济OJ接入 · Canvas Dashboard</title>
  {% include "_favicon.html" %}
  {% include "_font_assets.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>window.CSRF_TOKEN = "{{ csrf_token() }}";</script>
  <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body>
  <div class="dashboard">
    <a href="/" class="login-page-back">&#x2190; 返回看板</a>
    <div class="card enter-main-card">
      <div class="section-header">
        <h2>同济大学竞教融合实训平台 (同济OJ)</h2>
      </div>

      <p class="ui-feedback ui-feedback--info setup-hint" id="status-line" role="status" aria-live="polite">检查中...</p>

      <div class="ui-card ui-card--subtle ui-help detail-content-box connection-data-note connection-trust-card">
        <div class="connection-trust-card__head">
          <strong>同济OJ连接说明</strong>
          <a href="/privacy" target="_blank" rel="noopener noreferrer" class="connection-trust-card__link">查看隐私说明 →</a>
        </div>
        <dl class="connection-trust-grid">
          <div class="connection-trust-row"><dt>保存内容</dt><dd>加密登录凭据、加密会话 Cookie 与已选课程</dd></div>
          <div class="connection-trust-row"><dt>用途</dt><dd>仅只读同步顶层作业列表，绝不打开题目详情或代交代码</dd></div>
          <div class="connection-trust-row"><dt>不会保存</dt><dd>明文密码与短信二次验证临时验证码</dd></div>
          <div class="connection-trust-row"><dt>断开连接后</dt><dd>登录凭据与会话立即删除，历史作业缓存保留</dd></div>
        </dl>
      </div>

      <div class="login-body" id="form-body">
        <div id="tongjioj-logged-in" class="hidden logged-in-row">
          <span class="logged-in-label">已连接</span>
          <label class="ui-label connection-field-label" for="tjoj-course-select">课程筛选</label>
          <select id="tjoj-course-select" class="ui-control logged-in-select"></select>
          <button type="button" onclick="logoutTongjioj()" class="ui-button ui-button--danger ui-button--sm">断开连接</button>
        </div>

        <div id="tongjioj-setup" class="hidden">
          <div class="ktp-auth-tabs" role="tablist" aria-label="同济OJ登录方式切换">
            <button type="button" class="ui-button ui-button--choice ktp-auth-tab is-active" id="tjoj-tab-btn-iam" role="tab" aria-selected="true" onclick="switchTjojPageTab('iam')">统一身份认证登录</button>
            <button type="button" class="ui-button ui-button--choice ktp-auth-tab" id="tjoj-tab-btn-local" role="tab" aria-selected="false" onclick="switchTjojPageTab('local')">OJ 账号密码登录</button>
          </div>
          <div id="tjoj-iam-login-panel">
            <p class="ui-help setup-hint">推荐使用同济大学统一身份认证学号和密码登录：</p>
            <form class="add-todo-form mb-s" id="tjoj-iam-form">
              <label class="ui-label connection-field-label" for="tjoj-student-id">同济大学学号</label>
              <input type="text" id="tjoj-student-id" placeholder="同济大学学号" autocomplete="username" class="ui-control">
              <label class="ui-label connection-field-label" for="tjoj-iam-password">统一身份认证密码</label>
              <input type="password" id="tjoj-iam-password" placeholder="统一身份认证密码" autocomplete="current-password" class="ui-control">
              <button type="submit" id="tjoj-iam-submit-btn" class="ui-button ui-button--primary ui-button--block btn-wide btn-accent">统一身份认证登录</button>
            </form>
            <div id="tjoj-second-auth-box" class="hidden mb-s">
              <label class="ui-label connection-field-label" for="tjoj-second-auth-type">加强认证方式</label>
              <select id="tjoj-second-auth-type" class="ui-control mb-s"></select>
              <label class="ui-label connection-field-label" for="tjoj-second-auth-code">安全验证码</label>
              <div class="add-todo-form mb-s">
                <input type="text" id="tjoj-second-auth-code" placeholder="请输入短信或邮箱验证码" autocomplete="one-time-code" class="ui-control">
                <button type="button" id="tjoj-send-code-btn" onclick="sendTongjiojSecondAuthCode()" class="ui-button ui-button--secondary">发送验证码</button>
              </div>
              <button type="button" id="tjoj-verify-code-btn" onclick="verifyTongjiojSecondAuthCode()" class="ui-button ui-button--primary ui-button--block btn-wide">完成加强认证并登录</button>
            </div>
          </div>
          <div id="tjoj-local-login" class="hidden mt-s">
            <form class="add-todo-form" id="tjoj-local-form">
              <label class="ui-label connection-field-label" for="tjoj-username">OJ 用户名</label>
              <input type="text" id="tjoj-username" placeholder="OJ 用户名" autocomplete="username" class="ui-control">
              <label class="ui-label connection-field-label" for="tjoj-local-password">OJ 密码</label>
              <input type="password" id="tjoj-local-password" placeholder="OJ 密码" autocomplete="current-password" class="ui-control">
              <button type="submit" id="tjoj-local-submit-btn" class="ui-button ui-button--primary ui-button--block btn-wide">登录同济OJ</button>
            </form>
          </div>
        </div>

        <div class="ui-alert ui-alert--danger ui-alert--compact error-banner hidden" id="tongjioj-error" role="alert"></div>
      </div>
    </div>
  </div>

  <script>
    function populateTongjiojCourseSelect(select, courses, selectedCourse) {
      select.replaceChildren(new Option('全部课程 (' + (courses ? courses.length : 0) + ')', ''));
      (Array.isArray(courses) ? courses : []).forEach((course) => {
        const option = document.createElement('option');
        option.value = String(course.id || '');
        option.textContent = course.name || `课程 ${course.id}`;
        select.append(option);
      });
      select.value = selectedCourse || '';
    }

    function setTongjiojPageStatus(text, semantic = 'neutral') {
      const statusLine = document.getElementById('status-line');
      statusLine.textContent = text;
      statusLine.className = `ui-feedback ui-feedback--${semantic} setup-hint`;
    }

    function showTongjiojError(message) {
      const error = document.getElementById('tongjioj-error');
      error.textContent = message;
      error.classList.remove('hidden');
    }

    function hideTongjiojError() {
      const error = document.getElementById('tongjioj-error');
      error.classList.add('hidden');
    }

    function switchTjojPageTab(tab) {
      const iamPanel = document.getElementById('tjoj-iam-login-panel');
      const localPanel = document.getElementById('tjoj-local-login');
      const iamTab = document.getElementById('tjoj-tab-btn-iam');
      const localTab = document.getElementById('tjoj-tab-btn-local');
      hideTongjiojError();
      const isLocal = tab === 'local';
      iamPanel?.classList.toggle('hidden', isLocal);
      localPanel?.classList.toggle('hidden', !isLocal);
      iamTab?.classList.toggle('is-active', !isLocal);
      iamTab?.setAttribute('aria-selected', String(!isLocal));
      localTab?.classList.toggle('is-active', isLocal);
      localTab?.setAttribute('aria-selected', String(isLocal));
    }

    async function checkTongjiojConfig() {
      try {
        const resp = await fetch('/api/tongjioj/config');
        const result = await resp.json();
        if (result.ok && result.has_token) {
          setTongjiojPageStatus('当前状态：已连接', 'success');
          document.getElementById('tongjioj-setup').classList.add('hidden');
          document.getElementById('tongjioj-logged-in').classList.remove('hidden');
          if (result.courses) {
            const select = document.getElementById('tjoj-course-select');
            populateTongjiojCourseSelect(select, result.courses, result.selected_course || '');
          }
        } else {
          setTongjiojPageStatus('当前状态：未连接', 'neutral');
          document.getElementById('tongjioj-setup').classList.remove('hidden');
          document.getElementById('tongjioj-logged-in').classList.add('hidden');
        }
      } catch (e) {
        setTongjiojPageStatus('状态获取失败', 'danger');
        document.getElementById('tongjioj-setup').classList.remove('hidden');
      }
    }

    function showTjojLocalLogin() {
      switchTjojPageTab('local');
    }

    async function doTongjiojIamLogin(e) {
      if (e) e.preventDefault();
      const idInput = document.getElementById('tjoj-student-id');
      const pwdInput = document.getElementById('tjoj-iam-password');
      const studentId = idInput.value.trim();
      const password = pwdInput.value.trim();
      if (!studentId || !password) {
        showTongjiojError('请输入同济大学学号和统一身份认证密码');
        (!studentId ? idInput : pwdInput).focus();
        return;
      }
      hideTongjiojError();

      const btn = document.getElementById('tjoj-iam-submit-btn');
      const origText = btn.textContent;
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      btn.textContent = '登录中…';

      try {
        const resp = await fetch('/api/tongjioj/login-iam', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ student_id: studentId, password }),
        });
        const result = await resp.json();
        if (result.ok) {
          document.getElementById('tjoj-second-auth-box').classList.add('hidden');
          checkTongjiojConfig();
        } else if (result.need_second_auth) {
          const select = document.getElementById('tjoj-second-auth-type');
          select.replaceChildren();
          const methods = Array.isArray(result.auth_methods) && result.auth_methods.length
            ? result.auth_methods
            : [{ type: 'sms', label: result.mobile ? `手机短信 (${result.mobile})` : '手机短信验证' }];
          methods.forEach((m) => {
            select.append(new Option(m.label || '手机短信验证', m.type || 'sms'));
          });
          document.getElementById('tjoj-second-auth-box').classList.remove('hidden');
          showTongjiojError(result.error || '统一身份认证要求陌生设备加强认证，请发送并填写验证码');
        } else {
          showTongjiojError(result.error || '统一身份认证登录失败');
        }
      } catch (e) {
        showTongjiojError('网络错误，请稍后重试');
      } finally {
        btn.textContent = origText;
        btn.disabled = false;
        btn.setAttribute('aria-busy', 'false');
      }
    }

    let tjojSecondAuthCountdown = 0;
    let tjojSecondAuthTimer = null;

    async function sendTongjiojSecondAuthCode() {
      if (tjojSecondAuthCountdown > 0) return;
      const authType = document.getElementById('tjoj-second-auth-type').value || 'sms';
      const btn = document.getElementById('tjoj-send-code-btn');
      hideTongjiojError();
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      btn.textContent = '发送中…';

      try {
        const resp = await fetch('/api/tongjioj/iam-send-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: authType }),
        });
        const result = await resp.json();
        if (result.ok) {
          tjojSecondAuthCountdown = 60;
          if (tjojSecondAuthTimer) clearInterval(tjojSecondAuthTimer);
          btn.setAttribute('aria-busy', 'false');
          tjojSecondAuthTimer = setInterval(() => {
            tjojSecondAuthCountdown--;
            if (tjojSecondAuthCountdown <= 0) {
              clearInterval(tjojSecondAuthTimer);
              tjojSecondAuthTimer = null;
              btn.textContent = '发送验证码';
              btn.disabled = false;
            } else {
              btn.textContent = `${tjojSecondAuthCountdown}s 后重发`;
            }
          }, 1000);
          btn.textContent = `${tjojSecondAuthCountdown}s 后重发`;
          document.getElementById('tjoj-second-auth-code')?.focus();
        } else {
          showTongjiojError(result.error || '发送验证码失败');
          btn.textContent = '发送验证码';
          btn.disabled = false;
          btn.setAttribute('aria-busy', 'false');
        }
      } catch (e) {
        showTongjiojError('网络错误，请稍后重试');
        btn.textContent = '发送验证码';
        btn.disabled = false;
        btn.setAttribute('aria-busy', 'false');
      }
    }

    async function verifyTongjiojSecondAuthCode() {
      const authType = document.getElementById('tjoj-second-auth-type').value || 'sms';
      const codeInput = document.getElementById('tjoj-second-auth-code');
      const code = codeInput.value.trim();
      if (!code) {
        showTongjiojError('请输入验证码');
        codeInput.focus();
        return;
      }
      hideTongjiojError();
      const btn = document.getElementById('tjoj-verify-code-btn');
      const origText = btn.textContent;
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      btn.textContent = '验证中…';

      try {
        const resp = await fetch('/api/tongjioj/iam-verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: authType, code }),
        });
        const result = await resp.json();
        if (result.ok) {
          document.getElementById('tjoj-second-auth-box').classList.add('hidden');
          codeInput.value = '';
          if (tjojSecondAuthTimer) { clearInterval(tjojSecondAuthTimer); tjojSecondAuthTimer = null; tjojSecondAuthCountdown = 0; }
          const sendBtn = document.getElementById('tjoj-send-code-btn');
          if (sendBtn) { sendBtn.textContent = '发送验证码'; sendBtn.disabled = false; }
          checkTongjiojConfig();
        } else {
          showTongjiojError(result.error || '加强认证失败');
        }
      } catch (e) {
        showTongjiojError('网络错误，请稍后重试');
      } finally {
        btn.textContent = origText;
        btn.disabled = false;
        btn.setAttribute('aria-busy', 'false');
      }
    }

    async function doTongjiojLocalLogin(e) {
      if (e) e.preventDefault();
      const userInput = document.getElementById('tjoj-username');
      const pwdInput = document.getElementById('tjoj-local-password');
      const account = userInput.value.trim();
      const password = pwdInput.value.trim();
      if (!account || !password) {
        showTongjiojError('请输入 OJ 用户名和密码');
        (!account ? userInput : pwdInput).focus();
        return;
      }
      hideTongjiojError();

      const btn = document.getElementById('tjoj-local-submit-btn');
      const origText = btn.textContent;
      btn.disabled = true;
      btn.setAttribute('aria-busy', 'true');
      btn.textContent = '登录中…';

      try {
        const resp = await fetch('/api/tongjioj/login-local', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ account, password }),
        });
        const result = await resp.json();
        if (result.ok) {
          checkTongjiojConfig();
        } else {
          showTongjiojError(result.error || '登录失败');
        }
      } catch (e) {
        showTongjiojError('网络错误，请稍后重试');
      } finally {
        btn.textContent = origText;
        btn.disabled = false;
        btn.setAttribute('aria-busy', 'false');
      }
    }

    async function changeTongjiojCourse() {
      const select = document.getElementById('tjoj-course-select');
      const courseId = select ? select.value : '';
      try {
        const resp = await fetch('/api/tongjioj/course', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ course_id: courseId }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok || !data.ok) {
          showTongjiojError(data.error || '保存课程筛选失败');
        } else {
          hideTongjiojError();
          setTongjiojPageStatus('当前状态：已连接（课程筛选已保存）', 'success');
        }
      } catch (e) {
        showTongjiojError('保存课程筛选失败，请稍后重试');
      }
    }

    async function logoutTongjioj() {
      try {
        await fetch('/api/tongjioj/logout', { method: 'POST' });
      } catch (e) { /* ignore */ }
      setTongjiojPageStatus('当前状态：未连接', 'neutral');
      document.getElementById('tongjioj-setup').classList.remove('hidden');
      document.getElementById('tongjioj-logged-in').classList.add('hidden');
      document.getElementById('tjoj-second-auth-box').classList.add('hidden');
      hideTongjiojError();
      switchTjojPageTab('iam');
    }

    document.getElementById('tjoj-course-select')?.addEventListener('change', changeTongjiojCourse);
    document.getElementById('tjoj-iam-form')?.addEventListener('submit', doTongjiojIamLogin);
    document.getElementById('tjoj-local-form')?.addEventListener('submit', doTongjiojLocalLogin);
    ['tjoj-student-id', 'tjoj-iam-password', 'tjoj-second-auth-code', 'tjoj-username', 'tjoj-local-password'].forEach((id) => {
      document.getElementById(id)?.addEventListener('input', hideTongjiojError);
    });

    checkTongjiojConfig();
  </script>
</body>
</html>
