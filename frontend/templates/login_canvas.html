<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas 接入 · Canvas Dashboard</title>
  {% include "_favicon.html" %}
  {% include "_font_assets.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>window.CSRF_TOKEN = "{{ csrf_token() }}";</script>
  <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body>
  <div class="dashboard">
    <a href="/" class="login-page-back">&#x2190; 返回看板</a>
    <div class="card enter-main-card">
      <div class="section-header">
        <h2>Canvas</h2>
      </div>

      <p class="ui-feedback ui-feedback--info setup-hint" id="status-line" role="status" aria-live="polite">检查中...</p>

      <div class="login-body" id="form-body">
        <form class="add-todo-form" id="setup-form">
          <input type="url" id="feed-url-input" placeholder="粘贴日历馈送 URL（.ics）..." autocomplete="off" class="ui-control">
          <button type="submit" class="ui-button ui-button--primary ui-button--block btn-wide">保存</button>
        </form>
        <p class="ui-help setup-hint">
          请从 Canvas 获取日历馈送源 URL：<br>
          <small>Canvas → 日历 → 日历馈送 → 复制链接</small>
        </p>

        <div class="ui-alert ui-alert--danger ui-alert--compact error-banner hidden" id="canvas-error" role="alert"></div>
      </div>
    </div>
  </div>

  <script>
    async function loadStatus() {
      const statusLine = document.getElementById('status-line');
      try {
        const resp = await fetch('/api/config');
        const result = await resp.json();
        statusLine.textContent = result.has_feed ? '当前状态：已连接' : '当前状态：未配置';
        statusLine.className = `ui-feedback ${result.has_feed ? 'ui-feedback--success' : 'ui-feedback--neutral'} setup-hint`;
      } catch (e) {
        statusLine.textContent = '状态获取失败';
        statusLine.className = 'ui-feedback ui-feedback--danger setup-hint';
      }
    }

    async function saveFeedUrl(e) {
      e.preventDefault();
      const input = document.getElementById('feed-url-input');
      const url = input.value.trim();
      if (!url) return;

      const btn = input.nextElementSibling;
      btn.textContent = '...';
      btn.disabled = true;

      try {
        const resp = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ calendar_feed_url: url }),
        });
        const result = await resp.json();
        if (result.ok) {
          window.location.href = '/';
        } else {
          document.getElementById('canvas-error').textContent = result.error || '保存失败';
          document.getElementById('canvas-error').classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('canvas-error').textContent = '网络错误';
        document.getElementById('canvas-error').classList.remove('hidden');
      } finally {
        btn.textContent = '保存';
        btn.disabled = false;
      }
    }

    document.getElementById('setup-form').addEventListener('submit', saveFeedUrl);
    loadStatus();
  </script>
</body>
</html>
