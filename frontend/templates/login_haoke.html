<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好课接入 · Canvas Dashboard</title>
  {% include "_favicon.html" %}
  {% include "_font_assets.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>window.CSRF_TOKEN = "{{ csrf_token() }}";</script>
  <script src="{{ url_for('static', filename='js/csrf.js') }}"></script>
</head>
<body>
  <div class="dashboard">
    <a href="/" class="login-page-back">&#x2190; 返回看板</a>
    <div class="card enter-main-card">
      <div class="section-header">
        <h2>好课</h2>
      </div>

      <p class="ui-feedback ui-feedback--info setup-hint" id="status-line" role="status" aria-live="polite">检查中...</p>

      <div class="ui-card ui-card--subtle ui-help detail-content-box connection-data-note connection-trust-card">
        <div class="connection-trust-card__head">
          <strong>好课连接说明</strong>
          <a href="/privacy" target="_blank" rel="noopener noreferrer" class="connection-trust-card__link">查看隐私说明 →</a>
        </div>
        <dl class="connection-trust-grid">
          <div class="connection-trust-row"><dt>保存内容</dt><dd>学号 + 加密密码</dd></div>
          <div class="connection-trust-row"><dt>用途</dt><dd>仅用于自动同步课程作业</dd></div>
          <div class="connection-trust-row"><dt>不会保存</dt><dd>统一身份认证 Session 与明文密码</dd></div>
          <div class="connection-trust-row"><dt>断开连接后</dt><dd>账号密码立即删除，历史作业缓存保留</dd></div>
        </dl>
      </div>

      <div class="login-body" id="form-body">
        <form class="add-todo-form" id="haoke-setup-form">
          <input type="text" id="haoke-username" placeholder="学号" autocomplete="off" class="ui-control">
          <input type="password" id="haoke-password" placeholder="密码" autocomplete="off" class="ui-control">
          <button type="submit" class="ui-button ui-button--primary ui-button--block btn-wide">保存并登录</button>
        </form>
        <p class="ui-help setup-hint">
          使用同济大学统一身份认证的学号和密码登录（智图 AI 好课平台）
        </p>

        <div class="ui-alert ui-alert--danger ui-alert--compact error-banner hidden" id="haoke-error" role="alert"></div>
      </div>
    </div>
  </div>

  <script>
    async function loadStatus() {
      const statusLine = document.getElementById('status-line');
      try {
        const resp = await fetch('/api/haoke/config');
        const result = await resp.json();
        statusLine.textContent = result.has_credentials ? '当前状态：已连接' : '当前状态：未配置';
        statusLine.className = `ui-feedback ${result.has_credentials ? 'ui-feedback--success' : 'ui-feedback--neutral'} setup-hint`;
      } catch (e) {
        statusLine.textContent = '状态获取失败';
        statusLine.className = 'ui-feedback ui-feedback--danger setup-hint';
      }
    }

    async function saveHaokeCredentials(e) {
      e.preventDefault();
      const username = document.getElementById('haoke-username').value.trim();
      const password = document.getElementById('haoke-password').value.trim();
      if (!username || !password) return;

      const btn = document.querySelector('#haoke-setup-form button');
      btn.textContent = '...';
      btn.disabled = true;

      try {
        const resp = await fetch('/api/haoke/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const result = await resp.json();
        if (result.ok) {
          window.location.href = '/';
        } else {
          document.getElementById('haoke-error').textContent = result.error || '保存失败';
          document.getElementById('haoke-error').classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('haoke-error').textContent = '网络错误';
        document.getElementById('haoke-error').classList.remove('hidden');
      } finally {
        btn.textContent = '保存并登录';
        btn.disabled = false;
      }
    }

    document.getElementById('haoke-setup-form').addEventListener('submit', saveHaokeCredentials);
    loadStatus();
  </script>
</body>
</html>
